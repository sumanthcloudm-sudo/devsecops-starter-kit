name: Semgrep SAST

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Prepare report directory
        run: mkdir -p reports/semgrep

      - name: Run Semgrep
        run: |
          set -o pipefail
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config configs/semgrep/semgrep.yml \
            --metrics=off \
            --json-output reports/semgrep/semgrep-report.json \
            --error \
            --exclude samples/vulnerable-code \
            . 2>&1 | tee reports/semgrep/semgrep-report.txt

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: semgrep-reports
          path: reports/semgrep/
          if-no-files-found: warn
          retention-days: 14
