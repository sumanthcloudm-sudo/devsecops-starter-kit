name: Grype Container Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grype:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-sample:latest \
            -f samples/docker/Dockerfile \
            samples/docker

      - name: Scan Docker image with Grype
        uses: anchore/scan-action@v6
        id: grype
        with:
          image: docker:devsecops-sample:latest
          output-format: json
          output-file: reports/grype-report.json
          fail-build: false

      - name: Validate Grype report
        if: always()
        run: |
          if [ ! -s reports/grype-report.json ]; then
            echo "Grype did not produce a non-empty JSON report."
            exit 1
          fi
          python -m json.tool reports/grype-report.json > /dev/null
          echo "Grype JSON report is valid."

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: reports/grype-report.json
          if-no-files-found: error

      - name: Enforce High and Critical vulnerability gate
        run: |
          python - <<'PY'
          import json
          import sys

          with open("reports/grype-report.json", encoding="utf-8") as report:
              data = json.load(report)

          matches = data.get("matches")
          if not isinstance(matches, list):
              print("ERROR: Grype report is missing the matches array.")
              sys.exit(1)

          blocking = [
              match for match in matches
              if match.get("vulnerability", {}).get("severity", "").upper()
              in {"HIGH", "CRITICAL"}
          ]
          print(f"Grype findings: {len(matches)} total; {len(blocking)} High/Critical.")
          if blocking:
              print("Security gate FAILED: High or Critical vulnerabilities detected.")
              for match in blocking[:20]:
                  vuln = match.get("vulnerability", {})
                  print(f"- {vuln.get('id', 'unknown')} ({vuln.get('severity', 'unknown')})")
              sys.exit(1)
          print("Security gate PASSED: No High or Critical vulnerabilities.")
          PY
