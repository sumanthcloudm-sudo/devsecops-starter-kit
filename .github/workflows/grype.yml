name: Grype dependency and image scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grype:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install verified Grype
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/anchore/grype/releases/download/v0.121.3/grype_0.121.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/grype.tar.gz"
          echo 'e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85  '"$RUNNER_TEMP/grype.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP" grype
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan dependencies and image
        run: bash scripts/security-scan.sh grype
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: grype-image-reports
          path: reports/grype/
          if-no-files-found: warn
          retention-days: 14
