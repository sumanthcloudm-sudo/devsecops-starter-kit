name: Gitleaks Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Gitleaks scan
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: dir samples/code --config config/gitleaks/gitleaks.toml --report-format json --report-path reports/gitleaks-report.json --exit-code 0

      - name: Validate Gitleaks report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/gitleaks-report.json")
          if not path.is_file():
              raise SystemExit("Gitleaks report was not generated")
          with path.open(encoding="utf-8") as file:
              report = json.load(file)
          if not isinstance(report, list):
              raise SystemExit("Expected Gitleaks findings array")
          print(f"Gitleaks findings: {len(report)}")
          PY

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.json
          if-no-files-found: error
