
name: DevSecOps Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep pip-audit checkov

      - name: Install Gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | bash -s -- -b /usr/local/bin

      - name: Install Syft and Grype
        run: |
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://get.anchore.io/grype | sudo sh -s -- -b /usr/local/bin

      - name: Create report directory
        run: mkdir -p reports

      - name: Gitleaks scan
        continue-on-error: true
        run: |
          gitleaks dir samples/code \
            --report-format json \
            --report-path reports/gitleaks-local.json

      - name: Semgrep scan
        continue-on-error: true
        run: |
          semgrep scan \
            --config config/semgrep/rules.yml \
            --json \
            --output reports/semgrep-report.json \
            samples/code

      - name: Dependency scan
        continue-on-error: true
        run: |
          pip-audit \
            -r samples/code/requirements.txt \
            -f json \
            -o reports/pip-audit-local.json

      - name: Generate SBOM
        run: |
          syft dir:. \
            -o spdx-json=reports/syft-local.spdx.json

      - name: Checkov scan
        continue-on-error: true
        run: |
          checkov -d samples/terraform \
            -o json \
            --output-file-path reports/checkov-local.json

      - name: Build sample Docker image
        run: |
          docker build \
            -t devsecops-sample:latest \
            samples/docker

      - name: Grype image scan
        continue-on-error: true
        run: |
          grype devsecops-sample:latest \
            -o json \
            --file reports/grype-image-report.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-security-reports
          path: reports/
          if-no-files-found: warn
