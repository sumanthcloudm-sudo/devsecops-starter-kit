name: Syft SBOM

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install verified Syft
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/anchore/syft/releases/download/v1.57.1/syft_1.57.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/syft.tar.gz"
          echo 'bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c  '"$RUNNER_TEMP/syft.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate sample SBOMs
        env:
          SYFT_TARGET: samples/vulnerable-dependencies
          SYFT_REQUIRE_PACKAGES: "1"
          SYFT_CYCLONEDX_REPORT_PATH: ${{ runner.temp }}/syft-reports/sbom-cyclonedx.json
          SYFT_SPDX_REPORT_PATH: ${{ runner.temp }}/syft-reports/sbom-spdx.json
        run: bash scripts/security-scan.sh syft

      - name: Verify sample dependency
        run: |
          python3 - "$RUNNER_TEMP/syft-reports" <<'PY'
          import json
          import sys
          from pathlib import Path

          directory = Path(sys.argv[1])
          with (directory / "sbom-cyclonedx.json").open(encoding="utf-8") as source:
              cdx = json.load(source)
          with (directory / "sbom-spdx.json").open(encoding="utf-8") as source:
              spdx = json.load(source)
          for label, packages, version_field in (
              ("CycloneDX", cdx["components"], "version"),
              ("SPDX", spdx["packages"], "versionInfo"),
          ):
              if not any(
                  package.get("name", "").endswith("log4j-core")
                  and package.get(version_field) == "2.14.1"
                  for package in packages
              ):
                  raise SystemExit(f"{label} is missing the sample log4j-core 2.14.1 dependency")
          print("Both SBOMs include log4j-core 2.14.1.")
          PY

      - name: Upload SBOM reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: syft-sbom-reports
          path: ${{ runner.temp }}/syft-reports/
          if-no-files-found: warn
          retention-days: 14
