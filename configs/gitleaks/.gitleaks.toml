
title = "DevSecOps Starter Kit Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "test-only-synthetic-secret"
description = "Synthetic secret fixture for scanner validation"
regex = '''devsecops_fixture_secret\s*=\s*['"]([A-Za-z0-9]{32})['"]'''
secretGroup = 1

[allowlist]
description = "Ignore generated reports and dependency directories"
paths = [
  '''^reports/''',
  '''^\.git/''',
  '''^node_modules/'''
]
