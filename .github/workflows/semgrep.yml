name: Semgrep SAST

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/semgrep-reports"

      - name: Run Semgrep
        env:
          SEMGREP_EXCLUDE: ""
        run: |
          export SEMGREP_REPORT_PATH="$RUNNER_TEMP/semgrep-reports/semgrep-report.json"
          export SEMGREP_TEXT_REPORT_PATH="$RUNNER_TEMP/semgrep-reports/semgrep-report.txt"
          bash scripts/security-scan.sh semgrep

      - name: Verify vulnerable samples were scanned
        if: always()
        run: python3 tests/verify_semgrep_samples.py "$RUNNER_TEMP/semgrep-reports/semgrep-report.json"

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-reports
          path: ${{ runner.temp }}/semgrep-reports/
          if-no-files-found: warn
          retention-days: 14
