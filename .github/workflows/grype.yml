name: Grype Container Vulnerability Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  grype:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-sample:latest \
            -f samples/docker/Dockerfile \
            samples/docker

      - name: Scan Docker image with Grype
        uses: anchore/scan-action@v6
        id: grype
        with:
          image: docker:devsecops-sample:latest
          output-format: json
          output-file: reports/grype-report.json
          fail-build: false
          only-fixed: false

      - name: Validate Grype report
        if: always()
        run: |
          test -s reports/grype-report.json
          python -m json.tool reports/grype-report.json > /dev/null
          echo "Grype JSON report is valid."

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: reports/grype-report.json
          if-no-files-found: error

      - name: Summarize vulnerability findings
        if: always() && steps.grype.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter

          with open("reports/grype-report.json", encoding="utf-8") as f:
              report = json.load(f)
          matches = report.get("matches")
          if not isinstance(matches, list):
              raise SystemExit("Invalid Grype report: matches must be an array.")

          counts = Counter(
              (item.get("vulnerability", {}).get("severity") or "Unknown").title()
              for item in matches
          )
          lines = [
              "## Grype container scan",
              "",
              f"**Total findings:** {len(matches)}",
              "",
              "| Severity | Findings |",
              "|---|---:|",
          ]
          for severity in ("Critical", "High", "Medium", "Low", "Negligible", "Unknown"):
              if counts[severity]:
                  lines.append(f"| {severity} | {counts[severity]} |")
          lines += [
              "",
              "This starter kit intentionally scans demonstration inputs. Findings are reported and uploaded; they do not fail the demonstration workflow by default.",
              "Set the repository Actions variable GRYPE_ENFORCE=true to enable the High/Critical blocking gate.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(f"Grype completed: {len(matches)} findings.")
          PY

      - name: Enforce High and Critical vulnerability gate
        if: vars.GRYPE_ENFORCE == 'true'
        run: |
          python - <<'PY'
          import json
          import sys

          with open("reports/grype-report.json", encoding="utf-8") as report:
              data = json.load(report)
          matches = data.get("matches")
          if not isinstance(matches, list):
              print("ERROR: Grype report is missing the matches array.")
              sys.exit(1)

          blocking = [
              match for match in matches
              if (match.get("vulnerability", {}).get("severity") or "").upper()
              in {"HIGH", "CRITICAL"}
          ]
          print(f"Grype findings: {len(matches)} total; {len(blocking)} High/Critical.")
          if blocking:
              print("Security gate FAILED: High or Critical vulnerabilities detected.")
              for match in blocking:
                  vuln = match.get("vulnerability", {})
                  artifact = match.get("artifact", {})
                  fix = vuln.get("fix") or {}
                  versions = ", ".join(fix.get("versions") or []) or "not listed"
                  print(
                      f"- {vuln.get('id', 'unknown')} ({vuln.get('severity', 'unknown')}) "
                      f"package={artifact.get('name', 'unknown')} "
                      f"installed={artifact.get('version', 'unknown')} "
                      f"fix={versions}"
                  )
              sys.exit(1)
          print("Security gate PASSED: No High or Critical vulnerabilities.")
          PY
